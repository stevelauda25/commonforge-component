<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POD Client Test</title>
    <script>
      // Default to dark mode unless user explicitly toggled to light.
      // Runs before React mounts so there's no flash-of-light.
      (function () {
        try {
          var stored = localStorage.getItem('pod-client-theme');
          var dark = stored !== 'light';
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
